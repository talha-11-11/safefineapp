<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No internet</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0369a1;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0f172a; }
  .card { background: #fff; border-radius: 16px; padding: 28px 24px; max-width: 320px; text-align: center; }
  img { width: 72px; height: 72px; }
  button { margin-top: 16px; height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #0369a1; color: #fff; font-weight: 600; font-size: 15px; }
</style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="">
    <h1 style="font-size:20px">No internet</h1>
    <p>Internet nahi hai. Connection check karein aur dobara try karein.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
